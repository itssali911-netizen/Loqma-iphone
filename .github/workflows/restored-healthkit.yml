name: Restored 103 Health UI validation follow-up
on:
  push:
    branches: [validation/restore103-health-20261026]
permissions:
  contents: read
jobs:
  native-health:
    runs-on: macos-26
    timeout-minutes: 70
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      BUNDLE_ID: app.luqma.diary
      BUILD_NUMBER: '118'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 10
      - name: Prove the already compiled and regression-tested app inputs are unchanged
        run: |
          python3 Scripts/verify_restored_source.py --output Restore103Validation/source-freeze.json
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          baseline='dbcf4b214f4c8d696f19728ccf2d4ca1b3ede6c4'
          scopes=['Luqma','Luqma.xcodeproj','Package.swift','Scripts/build_ios.py','Scripts/build_project.py','Scripts/signing.py','Scripts/vision_compat.py','Tests','BuildTests','TestsUI/LuqmaInteractionTests.swift','Scripts/ui_interactions.py']
          changed=subprocess.check_output(['git','diff','--name-only',baseline,'HEAD','--',*scopes],text=True).splitlines()
          if changed:raise SystemExit('Previously tested production or regression inputs changed: '+', '.join(changed))
          pathlib.Path('Restore103Validation/followup-inputs.json').write_text(json.dumps(dict(previous_run=40272046666,previous_sdk_commit=baseline,commit=os.environ['GITHUB_SHA'],production_and_original_regression_inputs_unchanged=True,changed_production_paths=changed,reason='Only the Health UI test locators and this validation workflow differ; build and seven original regression results remain evidence for identical app inputs.'),indent=2)+'\n')
          PY
      - name: Run Core and build/signing/source-freeze tests
        run: |
          swift test -j 2 2>&1 | tee Restore103Validation/core-tests.log
          python3 -m unittest discover -s BuildTests -v 2>&1 | tee Restore103Validation/build-tests.log
      - name: Compile and exercise native Health consent and original English and Arabic navigation
        run: python3 Scripts/healthkit_ui_validation.py validate --fresh-build
      - name: Preserve actual native screenshots and complete test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: LUQMA-Restored-103-Health-followup-${{ github.run_id }}
          path: |
            HealthValidation/report.json
            HealthValidation/*.log
            HealthValidation/captures/
            Restore103Validation/
          if-no-files-found: error
