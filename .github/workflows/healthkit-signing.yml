name: HealthKit signing validation
on:
  push:
    branches: [fix/healthkit-development-signing-20261026]
permissions:
  contents: read
jobs:
  signing-checks:
    runs-on: macos-26
    timeout-minutes: 55
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      BUNDLE_ID: app.luqma.diary
      BUILD_NUMBER: '119'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 10
      - name: Verify approved103 code remains frozen
        run: python3 Scripts/verify_restored_source.py --output Restore103Validation/source-freeze.json
      - name: Compile both SDKs and run all Core and signing tests
        run: python3 Scripts/build_ios.py check --output BuildOutput
      - name: Verify current official Xcode command support
        run: |
          mkdir -p HealthSigning/tool-support
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json
          commands={'install-help.txt':['xcrun','devicectl','device','install','app','--help'],
                    'launch-help.txt':['xcrun','devicectl','device','process','launch','--help'],
                    'certificate-policy.txt':['security','help','verify-cert'],
                    'xcodebuild-help.txt':['xcodebuild','-help']}
          codes={}
          for name,arguments in commands.items():
              result=subprocess.run(arguments,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
              Path('HealthSigning/tool-support',name).write_text(result.stdout)
              codes[name]=result.returncode
          Path('HealthSigning/tool-support/help-exit-codes.json').write_text(json.dumps(codes,indent=2)+'\n')
          assert 'codeSign' in Path('HealthSigning/tool-support/certificate-policy.txt').read_text()
          for name in ('install-help.txt','launch-help.txt'):
              text=Path('HealthSigning/tool-support',name).read_text()
              assert '--device' in text and '--json-output' in text
          assert 'debugging' in Path('HealthSigning/tool-support/xcodebuild-help.txt').read_text()
          PY
      - name: Reject an actual unprovisioned device build rather than publish another unusable IPA
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess, sys
          result=subprocess.run([sys.executable,'Scripts/healthkit_device.py','inspect','--app','BuildOutput/device-derived/Build/Products/Release-iphoneos/Luqma.app','--output','HealthSigning/unsigned-negative-check'])
          report=json.loads(pathlib.Path('HealthSigning/unsigned-negative-check/signing-report.json').read_text())
          assert result.returncode!=0 and report['status']=='not_verified'
          assert 'No embedded Apple provisioning profile' in report['reason']
          assert report['ipa_produced'] is False and report['installation_verified'] is False
          PY
      - name: Record signing input availability without disclosing values
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: python3 Scripts/healthkit_ui_validation.py signing-status
      - name: Keep build and signing evidence; no unsigned IPA delivery
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: LUQMA-HealthKit-Signing-Checks-${{ github.run_id }}
          path: |
            BuildOutput/build-summary.json
            BuildOutput/core-tests.log
            BuildOutput/build-tests.log
            BuildOutput/device.log
            BuildOutput/simulator.log
            Restore103Validation/
            HealthSigning/signing-status.json
            HealthSigning/unsigned-negative-check/signing-report.json
            HealthSigning/tool-support/
          if-no-files-found: error
