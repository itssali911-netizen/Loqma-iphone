name: Food camera upgrade validation
on:
  push:
    branches: [feature/food-camera-upgrade]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  camera:
    runs-on: macos-26
    timeout-minutes: 55
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compile both iOS SDKs and run existing tests
        run: python3 Scripts/build_ios.py check
      - name: Native gallery test and small-iPhone Arabic/English captures
        run: python3 Scripts/food_camera_check.py
      - name: Preserve genuine build and Simulator evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Food-camera-validation
          path: |
            BuildOutput/*.log
            BuildOutput/build-summary.json
            CameraValidation/
          if-no-files-found: warn
