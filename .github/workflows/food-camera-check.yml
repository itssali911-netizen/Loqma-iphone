name: Food camera upgrade validation
on:
  push:
    branches: [feature/food-camera-upgrade]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: food-camera-${{ github.ref }}
  cancel-in-progress: true
jobs:
  camera:
    runs-on: macos-26
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Existing Swift core tests
        run: set -o pipefail; swift test -j 2 2>&1 | tee camera-core-tests.log
      - name: Existing build tools and native font tests
        if: ${{ !cancelled() }}
        run: set -o pipefail; python3 -m unittest discover -s BuildTests -v 2>&1 | tee camera-build-tests.log
      - name: Compile both real iOS SDKs
        id: sdks
        if: ${{ !cancelled() }}
        run: python3 Scripts/food_camera_build.py
      - name: Native gallery test and small-iPhone Arabic/English captures
        if: ${{ !cancelled() && steps.sdks.outcome == 'success' }}
        run: python3 Scripts/food_camera_check.py
      - name: Preserve genuine build and Simulator evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Food-camera-validation
          path: |
            BuildOutput/*.log
            BuildOutput/build-summary.json
            camera-*-tests.log
            CameraValidation/
          if-no-files-found: warn
