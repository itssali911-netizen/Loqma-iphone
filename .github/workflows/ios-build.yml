name: Luqma iPhone build

on:
  push:
    branches: [main, figma/original-design-fidelity]
    paths:
      - 'Luqma/**'
      - 'Luqma.xcodeproj/**'
      - 'Package.swift'
      - 'Tests/**'
      - 'TestsUI/**'
      - 'Scripts/import_off_catalog.py'
      - 'Scripts/export_off_catalog.py'
      - 'Scripts/import_mfp_catalog.py'
      - 'Scripts/Data/**'
      - 'Scripts/build_project.py'
      - 'Scripts/build_ios.py'
      - 'Scripts/ui_preview.py'
      - 'Scripts/ui_interactions.py'
      - 'Scripts/simulator_support.py'
      - 'Scripts/model_smoke.py'
      - 'Scripts/vision_compat.py'
      - 'Scripts/qwen3vl-compat.json'
      - 'Scripts/ModelCheck.swift'
      - 'Scripts/signing.py'
      - 'BuildTests/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: SDK check, AltStore personal re-signing, or signed Apple distribution
        required: true
        default: check
        type: choice
        options:
          - check
          - sideload
          - ad-hoc
          - app-store
      run_local_vision_audit:
        description: Also run the optional on-device Qwen/CLIP model audit
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: luqma-ios-${{ github.ref }}
  # Replace obsolete UI review builds; release/main runs still finish normally.
  cancel-in-progress: ${{ github.ref == 'refs/heads/figma/original-design-fidelity' }}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out app source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Select Xcode
        env:
          DEVELOPER_DIR: ${{ vars.XCODE_DEVELOPER_DIR || '/Applications/Xcode_26.6.app/Contents/Developer' }}
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          printf 'DEVELOPER_DIR=%s\n' "$DEVELOPER_DIR" >> "$GITHUB_ENV"

      - name: Check both Apple SDK targets without signing
        if: inputs.mode == 'check'
        env:
          BUNDLE_ID: ${{ vars.BUNDLE_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: python3 Scripts/build_ios.py check

      - name: Build IPA for AltStore personal re-signing
        if: github.event_name == 'push' || inputs.mode == 'sideload'
        env:
          BUNDLE_ID: ${{ vars.BUNDLE_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: python3 Scripts/build_ios.py sideload

      - name: Build a signed iPhone export
        if: inputs.mode == 'ad-hoc' || inputs.mode == 'app-store'
        env:
          BUILD_MODE: ${{ inputs.mode }}
          BUNDLE_ID: ${{ vars.BUNDLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: python3 Scripts/build_ios.py "$BUILD_MODE"

      - name: Downloadable app output
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Luqma-${{ inputs.mode || 'sideload' }}-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: |
            BuildOutput/Luqma.ipa
            BuildOutput/Luqma-Sideload.ipa
            BuildOutput/Luqma-Simulator.zip
            BuildOutput/build-summary.json
            BuildOutput/READ-ME.txt
          if-no-files-found: error
          retention-days: 7

      - name: Test actual navigation, food edits and persistence
        if: success()
        # Run the isolated fitness case before the other native scenarios and
        # screenshot capture so interaction regressions fail without that wait.
        # Keep derived data separate; capture requires a new UIPreview folder.
        timeout-minutes: 45
        run: python3 Scripts/ui_interactions.py --packages BuildOutput/Packages --derived UIInteractionDerived --output UIInteractions

      - name: Native interaction test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Luqma-ui-interactions-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: |
            UIInteractions/*.json
            UIInteractions/*.log
            UIInteractions/*.xcresult
            UIInteractions/permission-denied/
            UIInteractions/fitness-assessment/
          if-no-files-found: ignore
          retention-days: 7

      - name: Capture native SwiftUI screens
        if: success()
        # All 17 assessment pages, profile/review and three larger-text variants
        # join the original capture set with actual per-launch font audits.
        timeout-minutes: 35
        env:
          BUNDLE_ID: ${{ vars.BUNDLE_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: python3 Scripts/ui_preview.py --packages BuildOutput/Packages --output UIPreview

      - name: Native SwiftUI screenshots and report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Luqma-ui-preview-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: |
            UIPreview/*.png
            UIPreview/*.json
            UIPreview/*.log
            UIPreview/*.xcresult
            UIPreview/font-audits/
          if-no-files-found: ignore
          retention-days: 7

      - name: Capture reference-width English screens
        if: success()
        continue-on-error: true
        timeout-minutes: 15
        env:
          BUNDLE_ID: ${{ vars.BUNDLE_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: python3 Scripts/ui_preview.py --packages BuildOutput/Packages --app UIPreview/derived/Build/Products/Debug-iphonesimulator/Luqma.app --output UIReference --device-type com.apple.CoreSimulator.SimDeviceType.iPhone-13-mini --language en --screens today kitchen progress search macro-goals photo-estimate recipe-details notifications reminders state-error state-loading state-empty state-success assessment-goal assessment-gender assessment-diet assessment-activity assessment-sleep assessment-review fitness-profile fitness-plan assessment-age assessment-height assessment-weight assessment-target assessment-pace assessment-experience assessment-training assessment-exercise assessment-recovery assessment-preferences assessment-safety

      - name: Reference-width captures and readiness report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Luqma-reference-preview-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: |
            UIReference/*.png
            UIReference/*.json
            UIReference/*.log
            UIReference/font-audits/
          if-no-files-found: ignore
          retention-days: 7

      - name: Check local vision runtime on a supported runner
        if: success() && github.event_name == 'workflow_dispatch' && inputs.run_local_vision_audit
        timeout-minutes: 30
        run: python3 Scripts/model_smoke.py

      - name: Vision runtime report
        if: always() && github.event_name == 'workflow_dispatch' && inputs.run_local_vision_audit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Luqma-model-runtime-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: BuildOutput/model-runtime.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Luqma-diagnostics-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: |
            BuildOutput/*.log
            BuildOutput/*.xcresult
          if-no-files-found: ignore
          retention-days: 3
