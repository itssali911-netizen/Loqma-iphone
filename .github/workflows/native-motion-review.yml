name: Luqma native motion and preserved design review
on:
  push:
    branches: [feature/native-motion-review-20261028]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: luqma-native-motion-revision-${{ github.ref }}
  cancel-in-progress: true
env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  BUNDLE_ID: app.luqma.diary
  BUILD_NUMBER: '123'
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      app_unchanged: ${{ steps.scope.outputs.app_unchanged }}
      followup: ${{ steps.scope.outputs.followup }}
      paired: ${{ steps.scope.outputs.paired }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 30
          persist-credentials: false
      - id: scope
        shell: python
        run: |
          import os,subprocess
          verified='ef485cbae17c519809a6d8dde6ef790f4d7931bd'
          inputs=['Luqma','Luqma.xcodeproj','Package.swift','Scripts/qwen3vl-compat.json','Scripts/vision_compat.py']
          unchanged=subprocess.run(['git','diff','--quiet',verified,'HEAD','--',*inputs]).returncode==0
          changed=subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'],text=True).splitlines()
          followup=unchanged and any(p.startswith('TestsUI/') or p=='Scripts/motion_followup.py' for p in changed)
          # Repeat the mixed-host comparison once on a single runner when this
          # follow-up harness is first introduced, not on documentation pushes.
          paired=followup and 'Scripts/motion_followup.py' in changed
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              for k,v in [('app_unchanged',unchanged),('followup',followup),('paired',paired)]:
                  f.write(k+'='+str(v).lower()+'\n')
  baseline-visual:
    # The immutable 9f source is already being captured in run 40778353065.
    # Preserve that independent job rather than recompiling the baseline on
    # every correction. A manual dispatch may regenerate it explicitly.
    if: github.sha == '0a78986b0e683558ae109f31804491ad32910cab' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9f567b449579d78c22833b06d9d0836bb37b833d
          persist-credentials: false
      - name: Capture actual compiled pre-motion screens
        run: |
          python3 - <<'PY'
          import os,runpy,subprocess,sys
          sys.path.insert(0,'Scripts')
          os.environ['GITHUB_SHA']=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          sys.argv=['Scripts/ui_preview.py','--output','Motion-Before-AR','--language','ar']
          runpy.run_path('Scripts/ui_preview.py',run_name='__main__')
          PY
      - name: Preserve original baseline captures and runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: LUQMA-Motion-Before-${{ github.run_id }}
          path: |
            Motion-Before-AR/*.png
            Motion-Before-AR/*.log
            Motion-Before-AR/ui-preview.json
            Motion-Before-AR/font-audits/
          retention-days: 30
  native-validation:
    needs: scope
    if: needs.scope.outputs.app_unchanged != 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 180
    env:
      LUQMA_STRICT_DESIGN_REVIEW: '1'
      LUQMA_NATIVE_MOTION_REVIEW: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 30
      - name: Verify static drawing instructions, scope and component compilation
        run: |
          python3 Scripts/motion_review.py freeze --output Restore103Validation/motion-scope.json
          python3 Scripts/motion_review.py host-build
      - name: Build real iPhone Release and Simulator Debug and run actual tests
        run: python3 Scripts/build_ios.py check --output BuildOutput
      - name: Exercise real diary, quantities, assessment, navigation and accessibility
        run: python3 Scripts/motion_review.py validate
      - name: Capture settled Arabic screens with actual Reduce Motion environment
        if: success() || failure()
        env:
          LUQMA_PREVIEW_REDUCE_MOTION: '1'
        run: python3 Scripts/ui_preview.py --output Motion-After-AR --language ar --app BuildOutput/simulator-derived/Build/Products/Debug-iphonesimulator/Luqma.app
      - name: Capture normal-motion English and compact settled states
        if: success() || failure()
        run: |
          python3 Scripts/ui_preview.py --output Motion-After-EN --language en --app BuildOutput/simulator-derived/Build/Products/Debug-iphonesimulator/Luqma.app --screens today food-portion settings assessment-age
          python3 Scripts/ui_preview.py --output Motion-After-Compact --language ar --device-type com.apple.CoreSimulator.SimDeviceType.iPhone-13-mini --app BuildOutput/simulator-derived/Build/Products/Debug-iphonesimulator/Luqma.app --screens today food-portion
      - name: Preserve real motion evidence without exporting or publishing an IPA
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: LUQMA-Motion-After-${{ github.run_id }}
          path: |
            BuildOutput/build-summary.json
            BuildOutput/*.log
            BuildOutput/CalorieCardReview/report.json
            BuildOutput/CalorieCardReview/*.log
            BuildOutput/CalorieCardReview/captures/
            BuildOutput/CalorieCardReview/permission-denied/*.json
            BuildOutput/CalorieCardReview/permission-denied/*.log
            BuildOutput/CalorieCardReview/native-motion/*.json
            BuildOutput/CalorieCardReview/native-motion/*.log
            BuildOutput/CalorieCardReview/native-motion/*.mov
            Restore103Validation/motion-scope.json
            Restore103Validation/CalorieCardHost/host-build-report.json
            Restore103Validation/CalorieCardHost/*.log
            Motion-After-*/*.png
            Motion-After-*/ui-preview.json
            Motion-After-*/*.log
            Motion-After-*/font-audits/
          retention-days: 30
      - name: Preserve full XCTest results separately
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: LUQMA-Motion-XCTest-${{ github.run_id }}
          path: |
            BuildOutput/CalorieCardReview/calorie-card.xcresult/
            BuildOutput/CalorieCardReview/permission-denied/interactions.xcresult/
            BuildOutput/CalorieCardReview/native-motion/interactions.xcresult/
          retention-days: 30
  performance:
    needs: scope
    if: needs.scope.outputs.app_unchanged != 'true'
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, motion]
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.variant == 'baseline' && '9f567b449579d78c22833b06d9d0836bb37b833d' || github.sha }}
          persist-credentials: false
      - name: Resolve the existing project dependencies before benchmarking
        run: |
          xcodebuild -resolvePackageDependencies -project Luqma.xcodeproj -scheme Luqma -clonedSourcePackagesDirPath BuildOutput/Packages > Motion-Performance-packages.log 2>&1
          cp Luqma.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved Motion-Performance-Package.resolved
      - name: Measure existing Release UI scenarios with actual XCTest metrics
        run: |
          python3 - <<'PY'
          import os,runpy,subprocess,sys
          sys.path.insert(0,'Scripts')
          os.environ['GITHUB_SHA']=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          sys.argv=['Scripts/performance_probe.py','--output','Motion-Performance','--label','baseline' if '${{ matrix.variant }}'=='baseline' else 'optimized','--expected-revision',os.environ['GITHUB_SHA'],'--timeout','5400']
          runpy.run_path('Scripts/performance_probe.py',run_name='__main__')
          PY
      - name: Preserve measurements including failures and compatibility limits
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: LUQMA-Motion-Performance-${{ matrix.variant }}-${{ github.run_id }}
          path: |
            Motion-Performance/*.json
            Motion-Performance/*.log
            Motion-Performance-packages.log
            Motion-Performance-Package.resolved
          retention-days: 30
  followup-validation:
    needs: scope
    if: needs.scope.outputs.followup == 'true'
    runs-on: macos-26
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 30
          persist-credentials: false
      - name: Rebuild and recheck real controls with corrected automation
        run: python3 Scripts/motion_followup.py
      - name: Preserve actual follow-up evidence and recording
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: LUQMA-Motion-Followup-${{ github.run_id }}
          path: |
            Motion-Followup/*.json
            Motion-Followup/Package.resolved
            Motion-Followup/*.log
            Motion-Followup/*/*.json
            Motion-Followup/*/*.log
            Motion-Followup/*/*.mov
          retention-days: 30
      - name: Preserve native XCTest result bundles
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: LUQMA-Motion-Followup-XCTest-${{ github.run_id }}
          path: Motion-Followup/*/interactions.xcresult/
          retention-days: 30
  paired-performance-confirmation:
    needs: scope
    if: needs.scope.outputs.paired == 'true'
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9f567b449579d78c22833b06d9d0836bb37b833d
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: motion
          persist-credentials: false
      - name: Measure baseline then motion on the same actual CI Mac
        run: |
          python3 - <<'PY'
          import os,subprocess
          from pathlib import Path
          root=Path.cwd()
          for name,label in [('baseline','baseline'),('motion','optimized')]:
              cwd=root/name
              with (cwd/'paired-packages.log').open('w') as log:
                  subprocess.run(['xcodebuild','-resolvePackageDependencies','-project','Luqma.xcodeproj','-scheme','Luqma','-clonedSourcePackagesDirPath',str(root/'SharedPackages')],cwd=cwd,stdout=log,stderr=subprocess.STDOUT,check=True)
              lock=cwd/'Luqma.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved'
              (cwd/'paired-Package.resolved').write_bytes(lock.read_bytes())
              revision=subprocess.check_output(['git','rev-parse','HEAD'],cwd=cwd,text=True).strip()
              env=dict(os.environ,GITHUB_SHA=revision)
              code="import runpy,sys;sys.path.insert(0,'Scripts');sys.argv=['Scripts/performance_probe.py','--output','Paired-Performance','--label',"+repr(label)+",'--packages',"+repr(str(root/'SharedPackages'))+",'--expected-revision',"+repr(revision)+",'--timeout','5400'];runpy.run_path('Scripts/performance_probe.py',run_name='__main__')"
              subprocess.run(['python3','-c',code],cwd=cwd,env=env,check=True)
          if (root/'baseline/paired-Package.resolved').read_bytes()!=(root/'motion/paired-Package.resolved').read_bytes():
              raise RuntimeError('Package resolutions differ; do not claim a comparable result.')
          PY
      - name: Preserve both raw measurements, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: LUQMA-Motion-Paired-Performance-${{ github.run_id }}
          path: |
            baseline/Paired-Performance/*.json
            baseline/Paired-Performance/*.log
            baseline/paired-*
            motion/Paired-Performance/*.json
            motion/Paired-Performance/*.log
            motion/paired-*
          retention-days: 30
