name: Luqma food and recipe control verification
on:
  push:
    branches: [feature/recipe-macros-catalog-20261103]
    paths:
      - 'TestsUI/LuqmaInteractionTests.swift'
      - '.github/workflows/production-flow-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  BUILD_NUMBER: '125'
  BUNDLE_ID: app.luqma.diary
jobs:
  production-controls:
    runs-on: macos-26
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Resolve the unchanged native dependencies
        run: xcodebuild -resolvePackageDependencies -project Luqma.xcodeproj -scheme Luqma -clonedSourcePackagesDirPath BuildOutput/Packages > packages.log 2>&1
      - name: Exercise all four real food and recipe flows on a fresh Simulator
        run: |
          python3 - <<'PY'
          import json,os,sys,subprocess
          from pathlib import Path
          sys.path.insert(0,'Scripts')
          from ui_preview import command,select_runtime
          from ui_interactions import run_scenario
          from recipe_card_review import PRODUCT_TESTS
          from vision_compat import apply_vision_compat
          output=Path('Production-Verification').resolve()
          output.mkdir()
          report=dict(status='running',source_commit=os.environ['GITHUB_SHA'],
              application_tree=subprocess.check_output(['git','rev-parse','HEAD:Luqma'],text=True).strip(),
              required_cases=list(PRODUCT_TESTS),physical_device_verified=False,
              injected_remote_responses=False,synthetic_foods='Disposable data created through actual manual-entry controls')
          try:
              apply_vision_compat(Path('BuildOutput/Packages').resolve())
              runtime=select_runtime(json.loads(command(['xcrun','simctl','list','--json'],output,'inventory')))
              run_scenario(output/'controls',Path('BuildOutput/Packages').resolve(),
                  Path('BuildOutput/simulator-derived').resolve(),runtime,PRODUCT_TESTS,report,'125',
                  signing_settings=['CODE_SIGNING_ALLOWED=YES','CODE_SIGN_IDENTITY=-'],
                  test_class='LuqmaInteractionTests',timeout_seconds=2700)
              if report.get('passed_cases')!=list(PRODUCT_TESTS):
                  raise RuntimeError('Not every required real control case passed')
              report['status']='passed'
          except BaseException as error:
              report.update(status='failed',error=str(error))
              raise
          finally:
              (output/'report.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - name: Export genuine native screenshots
        if: always()
        run: |
          result=Production-Verification/controls/interactions.xcresult
          if [ -d "$result" ]; then
            xcrun xcresulttool export attachments --path "$result" --output-path Production-Verification/controls/attachments
          fi
      - name: Preserve actual verification and failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: LUQMA-Production-Verification-${{ github.run_id }}
          path: |
            packages.log
            Production-Verification/
          retention-days: 30
